# ============================================
# Image Specifications for Pre-Generation
# ============================================
# Theme: Retro School Computer / Military Briefing / 1990s PC Strategy
#
# Consistent Style Tokens:
# - "1-bit dithered pixel art" OR "vector line art on beige paper"
# - "Monochrome or limited palette (Black, Red, Green on Beige)"
# - "High contrast, thick outlines"

global_style:
  base: >
    retro 1990s PC strategy game asset, pixel art style or low-fi digitized photograph style. 
    Displayed on a beige paper texture background (#F3F3E8). 
    Stark black outlines, high contrast. 
    Military briefing aesthetic. 
    No text, no labels.
  
  # Category-specific overrides to ensure consistency within groups
  categories:
    weapons: "technical line-art illustration, side profile, black ink on beige paper, blueprint style"
    leaders: "digitized low-res portrait, 1990s VGA style, dithered shading, serious expression, passport photo composition"
    maps: "tactical military map, top-down view, simple geographic outlines, NATO operational symbols"
    news: "grainy black and white newspaper photo, halftone pattern, dramatic lighting"

