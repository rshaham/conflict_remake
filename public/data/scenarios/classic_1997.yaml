# Opening narrative
openingNarrative: |
  January 1997. Your predecessor has been assassinated by a Palestinian extremist.

  You have been thrust into the role of Prime Minister at the worst possible time.
  Syria masses troops on the Golan. Iraq's nuclear program advances despite sanctions.
