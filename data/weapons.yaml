# data/weapons.yaml
# Arms vendors and weapons catalog

vendors:
  usa:
    id: "usa"
    name: "United States"
    flag: "us"
    willEmbargo: true
    embargoTriggers:
      - "unprovoked_invasion"
      - "nuclear_strike"
      - "civilian_airstrike"
    embargoLiftCondition: "next_un_summit"
    exclusivityConflict: "black_market"

  uk:
    id: "uk"
    name: "United Kingdom"
    flag: "gb"
    willEmbargo: true
    embargoTriggers:
      - "unprovoked_invasion"
      - "nuclear_strike"
    embargoLiftCondition: "next_un_summit"

  france:
    id: "france"
    name: "France"
    flag: "fr"
    willEmbargo: false

  black_market:
    id: "black_market"
    name: "Black Market"
    flag: "pirate"
    description: "South African dealer with Soviet equipment"
    willEmbargo: false
    deliveryDelay: 2
    priceModifier: 1.2
    alwaysAvailable: true

