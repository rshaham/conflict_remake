    exclusivityConflict: "black_market"

  uk:
    id: "uk"
    name: "United Kingdom"
    flag: "gb"
    willEmbargo: true
    embargoTriggers:
      - "unprovoked_invasion"
      - "nuclear_strike"
    embargoLiftCondition: "next_un_summit"

  france:
    id: "france"
    name: "France"
    flag: "fr"
    willEmbargo: false
    description: "France has no embargo policy - sells to anyone"

  black_market:
    id: "black_market"
    name: "Black Market"
    flag: "pirate"
    description: "Third-party dealers with Soviet equipment"
